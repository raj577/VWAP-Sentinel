services:
  postgres:
    image: postgres:16-alpine
    container_name: vwap-postgres
    environment:
      POSTGRES_USER: avwap
      POSTGRES_PASSWORD: avwap
      POSTGRES_DB: avwap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avwap -d avwap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vwap-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://avwap:avwap@postgres:5432/avwap
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FYERS_CLIENT_ID: ${FYERS_CLIENT_ID:-}
      FYERS_SECRET_KEY: ${FYERS_SECRET_KEY:-}
      FYERS_REDIRECT_URI: ${FYERS_REDIRECT_URI:-http://localhost:8000/api/v1/fyers/callback}
      FYERS_BACKEND_REDIRECT_URI: ${FYERS_BACKEND_REDIRECT_URI:-http://localhost:8000/api/v1/fyers/callback}
      FYERS_TOKEN_FILE: /app/data/access_token.txt
      FYERS_TOKEN_META_FILE: /app/data/token_meta.json
      FYERS_CACHE_DIR: /app/data/cache
      FYERS_LOG_DIR: /app/logs
      FYERS_PRESETS_FILE: /app/data/presets.json
      SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-56}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-insecure-secret-change-me-please-rotate-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-vwap-sentinel}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vwap-sentinel-clients}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_DEV_EXPOSE_TOKENS: ${AUTH_DEV_EXPOSE_TOKENS:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@vwap-sentinel.local}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vwap-api
    environment: *backend_env
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker_main"]
    environment: *backend_env
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.scheduler_main"]
    environment: *backend_env
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        API_INTERNAL_URL: http://backend:8000/api/v1
    container_name: vwap-web
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      FYERS_BACKEND_REDIRECT_URI: ${FYERS_BACKEND_REDIRECT_URI:-http://localhost:8000/api/v1/fyers/callback}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_data:
  backend_logs:
